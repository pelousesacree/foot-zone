name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Préparer le projet Android
        run: |
          flutter create --platforms=android --org com.footzone --project-name foot_zone .
          rm -f test/widget_test.dart
          sed -i 's/android:label="foot_zone"/android:label="Foot Zone"/' android/app/src/main/AndroidManifest.xml
          # L'analyse « lint » d'Android plante dans un module externe (image_picker) : on la désactive pour la construction.
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }
          }
          KTS

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests du moteur
        run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Nommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "FootZone-test-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FootZone-test-${{ github.run_number }}
          path: FootZone-test-*.apk

      - name: Publier la version de test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Foot Zone test ${{ github.run_number }}
          prerelease: true
          files: FootZone-test-*.apk
